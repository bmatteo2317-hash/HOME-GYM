<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Classifiche · HOME-GYM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="app.css" />
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body data-page="rank">
<main class="w-full max-w-sm mx-auto px-3 pt-4 pb-10 space-y-3" style="padding-top:calc(1rem + env(safe-area-inset-top))">
  <div class="flex items-center gap-2">
    <a href="index.html" aria-label="Esci e torna alla Home" class="touch press glass rounded-full font-extrabold text-xl" style="width:56px;height:56px;display:flex;align-items:center;justify-content:center">‹</a>
    <h1 class="font-extrabold text-xl">🏆 Classifiche</h1>
  </div>
  <div id="banner" class="hidden text-xs px-4 py-3 glass rounded-2xl text-amber-300"></div>
  <div class="glass rounded-3xl p-4">
    <p class="text-[11px] uppercase tracking-widest text-slate-400 mb-1.5">Esercizio (tutti e 4)</p>
    <select id="rankExG" onchange="loadRank()" class="touch w-full bg-white/5 border border-white/10 rounded-2xl px-4 outline-none"></select>
    <p class="text-[11px] uppercase tracking-widest text-slate-400 mt-3 mb-1.5">Metrica</p>
    <div class="grid grid-cols-3 gap-2">
      <button id="mVol" onclick="setMetric('volume')" class="seg touch press glass rounded-2xl text-xs font-extrabold">📦 Volume</button>
      <button id="mPr" onclick="setMetric('pr')" class="seg touch press glass rounded-2xl text-xs font-extrabold">🏆 PR</button>
      <button id="mStreak" onclick="setMetric('streak')" class="seg touch press glass rounded-2xl text-xs font-extrabold">🔥 Streak</button>
    </div>
    <p class="text-[11px] uppercase tracking-widest text-slate-400 mt-3 mb-1.5">Ambito</p>
    <div class="grid grid-cols-3 gap-2">
      <button id="gGlobal" onclick="setScope('global')" class="seg touch press glass rounded-2xl text-xs font-extrabold">🌍</button>
      <button id="gCountry" onclick="setScope('country')" class="seg touch press glass rounded-2xl text-xs font-extrabold">🇮🇹</button>
      <button id="gRoom" onclick="setScope('room')" class="seg touch press glass rounded-2xl text-xs font-extrabold">🔒</button>
    </div>
    <div id="periodBlock">
      <p class="text-[11px] uppercase tracking-widest text-slate-400 mt-3 mb-1.5">Periodo</p>
      <div class="grid grid-cols-3 gap-2">
        <button id="gToday" onclick="setPeriod('today')" class="seg touch press glass rounded-2xl text-xs font-extrabold">Oggi</button>
        <button id="gWeek" onclick="setPeriod('week')" class="seg touch press glass rounded-2xl text-xs font-extrabold">Settimana</button>
        <button id="gAll" onclick="setPeriod('all')" class="seg touch press glass rounded-2xl text-xs font-extrabold">Sempre</button>
      </div>
    </div>
    <div id="roomPanel" class="hidden mt-3"></div>
    <div id="rankList" class="mt-3 space-y-2"></div>
  </div>
</main>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-8 z-30 px-5 py-3 rounded-2xl font-bold text-sm opacity-0 pointer-events-none glass whitespace-nowrap">✅</div>
<script src="app.js"></script>
</body>
</html>
