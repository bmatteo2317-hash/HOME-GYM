<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>HOME-GYM · Day Navigator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{ -webkit-tap-highlight-color:transparent }
body{ background:#000; color:#f1f5f9; font-family:-apple-system,"SF Pro Display",Inter,sans-serif; min-height:100dvh }
.glass{ background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.04)); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid rgba(255,255,255,.10) }
.touch{ min-height:56px; min-width:56px; touch-action:manipulation; user-select:none; -webkit-user-select:none }
.type-btn.active{ background:linear-gradient(135deg,#6366f1,#22d3ee); color:#fff; border-color:transparent }
.var-btn.active{ background:#fff; color:#0f172a; border-color:transparent }
.tab-btn{ color:#64748b } .tab-btn.active{ color:#fff }
.tab-btn.active .tab-icon{ background:linear-gradient(135deg,#6366f1,#22d3ee); transform:translateY(-2px) }
.page{ display:none } .page.active{ display:block; animation:fu .3s ease }
@keyframes fu{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
#toast{ transition:all .3s ease } .press:active{ transform:scale(.95) }
input{ color-scheme:dark; font-size:16px !important }
.bar{ transition:width .5s ease }
.arrow:disabled{ opacity:.3 }
</style>
</head>
<body>
<main class="w-full max-w-sm mx-auto px-3 pt-4 pb-32 space-y-3" style="padding-top:calc(1rem + env(safe-area-inset-top))">
<header class="glass rounded-3xl p-4 text-center">
  <h1 class="text-xl font-extrabold">💪 Home Gym</h1>
  <!-- Navigazione giorni < > : mai nel futuro -->
  <div class="flex items-center justify-between mt-3 gap-2">
    <button id="dayPrev" onclick="moveDay(-1)" class="arrow touch press glass rounded-2xl w-14 text-xl font-extrabold" aria-label="Giorno precedente">‹</button>
    <div class="flex-1"><p id="dayLabel" class="font-extrabold">—</p><p id="daySub" class="text-[11px] text-slate-400">—</p></div>
    <button id="dayNext" onclick="moveDay(1)" class="arrow touch press glass rounded-2xl w-14 text-xl font-extrabold" aria-label="Giorno successivo">›</button>
  </div>
  <button onclick="goToday()" class="text-[11px] font-bold text-indigo-300 mt-1">↩ Torna a oggi</button>
</header>
<div id="banner" class="hidden text-xs px-4 py-3 glass rounded-2xl text-amber-300"></div>

<section id="page-add" class="page active space-y-3">
  <!-- Obiettivo giornaliero -->
  <div class="glass rounded-3xl p-4">
    <div class="flex items-end justify-between"><h2 class="font-bold text-sm">🎯 Obiettivo giornaliero</h2><span id="goalPct" class="text-sm font-extrabold text-emerald-300">0%</span></div>
    <div class="h-3.5 mt-2 rounded-full bg-white/10 overflow-hidden"><div id="goalBar" class="bar h-full rounded-full" style="width:0%;background:linear-gradient(90deg,#34d399,#22d3ee)"></div></div>
    <div class="flex items-center gap-2 mt-2">
      <p id="goalText" class="text-[11px] text-slate-400 flex-1"></p>
      <button onclick="changeGoal()" class="text-[11px] font-bold glass rounded-xl px-3 py-2">✏️ <span id="goalVal">100</span></button>
    </div>
  </div>
  <div class="glass rounded-3xl p-4">
    <p class="text-[11px] uppercase tracking-widest text-slate-400 mb-2">1 · Tipologia</p>
    <div id="typeGrid" class="grid grid-cols-2 gap-2"></div>
    <p class="text-[11px] uppercase tracking-widest text-slate-400 mt-3 mb-2">2 · Variante</p>
    <div id="varGrid" class="flex flex-wrap gap-2"></div>
    <p id="unitHint" class="text-[11px] font-bold text-indigo-300 mt-2"></p>
    <div class="flex items-stretch gap-2 mt-2">
      <button onclick="step(-5)" class="touch press glass flex-1 rounded-2xl text-lg font-extrabold text-red-300">−5</button>
      <input id="inAmount" type="number" value="10" min="1" max="100000" inputmode="numeric" class="w-24 bg-white/5 border border-white/10 rounded-2xl py-3 text-2xl font-extrabold text-center outline-none" />
      <button onclick="step(5)" class="touch press glass flex-1 rounded-2xl text-lg font-extrabold text-emerald-300">+5</button>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-2">
      <button onclick="step(-1)" class="touch press glass rounded-2xl font-bold">−1</button>
      <button onclick="step(1)" class="touch press glass rounded-2xl font-bold text-emerald-300">+1</button>
      <button onclick="step(10)" class="touch press glass rounded-2xl font-bold text-emerald-300">+10</button>
    </div>
    <button onclick="save()" class="touch press w-full mt-3 rounded-[24px] py-4 font-extrabold text-lg text-white" style="background:linear-gradient(135deg,#6366f1,#22d3ee)">➕ Salva nel giorno</button>
  </div>
</section>

<section id="page-stats" class="page space-y-3">
  <div class="glass rounded-3xl p-4"><h2 class="font-bold">📊 Dettaglio esercizi · Record Personale (PR)</h2><div id="perEx" class="mt-2 space-y-2"></div></div>
</section>
<section id="page-hist" class="page space-y-3">
  <div class="glass rounded-3xl p-4"><h2 class="font-bold">📜 Storico <span id="histDate" class="text-xs font-normal text-slate-400"></span></h2><div id="history" class="mt-2 space-y-2"></div></div>
</section>
</main>

<nav class="fixed bottom-0 inset-x-0 z-20 px-3" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom))">
  <div class="max-w-sm mx-auto glass flex justify-around py-2.5" style="border-radius:28px">
    <button onclick="tab('add')" data-tab="add" class="tab-btn active flex flex-col items-center px-6"><span class="tab-icon touch flex items-center justify-center w-14 h-11 rounded-2xl bg-white/5 text-xl">➕</span><span class="text-[10px] font-bold">Inserisci</span></button>
    <button onclick="tab('stats')" data-tab="stats" class="tab-btn flex flex-col items-center px-6"><span class="tab-icon touch flex items-center justify-center w-14 h-11 rounded-2xl bg-white/5 text-xl">📊</span><span class="text-[10px] font-bold">Stats</span></button>
    <button onclick="tab('hist')" data-tab="hist" class="tab-btn flex flex-col items-center px-6"><span class="tab-icon touch flex items-center justify-center w-14 h-11 rounded-2xl bg-white/5 text-xl">📜</span><span class="text-[10px] font-bold">Storico</span></button>
  </div>
</nav>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-30 px-5 py-3 rounded-2xl font-bold text-sm opacity-0 pointer-events-none glass whitespace-nowrap">✅</div>

<script>
const TYPES = {
  'Flessioni': { icon:'💪', unit:'reps', variants:['Larghe','Strette','Diamond','Classiche','Decline','Incline'] },
  'Addominali':{ icon:'🔥', unit:'reps', variants:['Bassi','Alti','Isometrici'] },
  'Plank':     { icon:'⏱️', unit:'seconds', variants:['Normale','Laterale','Dinamico'] },
  'Trazioni':  { icon:'🧗', unit:'reps', variants:['Pronate','Supine','Neutre','Wide'] },
  'Chin-up':   { icon:'🏋️', unit:'reps', variants:['Classiche','Close grip'] },
};
const NAMES = []; Object.entries(TYPES).forEach(([t,i])=>i.variants.forEach(v=>NAMES.push({ type:t, variant:v, label:t+' · '+v, unit:i.unit, icon:i.icon })));
let type='Flessioni', variant='Larghe', data=[], goal=100;
let dayOffset = 0; // 0 = oggi, negativo = passato, mai positivo (no futuro)
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isoOf=d=>d.toISOString().slice(0,10);
const realToday=()=>{ const n=new Date(); n.setHours(0,0,0,0); return n; };
const selDate=()=>{ const d=realToday(); d.setDate(d.getDate()+dayOffset); return d; };
function toast(m){ const t=$('toast'); t.textContent=m; t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity='0',2000); }
async function api(p,o={}){ const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||r.status); return d; }
function tab(n){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); $('page-'+n).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===n)); }

/* --- day navigator: default oggi, frecce, no futuro --- */
function paintDay(){
  const d=selDate(), iso=isoOf(d);
  const isToday = dayOffset===0;
  $('dayLabel').textContent = d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  $('daySub').textContent = isToday ? '📍 Oggi · '+iso : iso + (dayOffset<0 ? ` · ${-dayOffset}g fa` : '');
  $('dayNext').disabled = isToday; // freccia futuro bloccata
  $('histDate').textContent = '· '+iso;
  render();
}
function moveDay(dir){
  if(dir>0 && dayOffset>=0) return toast('⛔ Non puoi andare nel futuro');
  dayOffset=Math.min(0,dayOffset+dir); paintDay();
}
function goToday(){ dayOffset=0; paintDay(); }

/* --- selezione tipologia → variante --- */
function renderTypes(){
  $('typeGrid').innerHTML=Object.entries(TYPES).map(([t,i])=>`<button onclick="pickType('${esc(t)}')" class="type-btn touch press glass px-3 py-3 text-left text-[13px] font-bold ${t===type?'active':''}" style="border-radius:20px">${i.icon} ${esc(t)}<br><span class="opacity-70 text-[11px] font-normal">${i.unit==='seconds'?'secondi':'reps'}</span></button>`).join('');
  $('varGrid').innerHTML=TYPES[type].variants.map(v=>`<button onclick="pickVar('${esc(v)}')" class="var-btn touch press glass px-4 text-sm font-bold ${v===variant?'active':''}" style="border-radius:16px;min-height:48px">${esc(v)}</button>`).join('');
  const u=TYPES[type].unit;
  $('unitHint').textContent = u==='seconds' ? '⏱️ Plank: inserisci SECONDI' : '🔁 Ripetizioni';
  if(u==='seconds' && parseInt($('inAmount').value,10)<20) $('inAmount').value=30;
}
function pickType(t){ type=t; variant=TYPES[t].variants[0]; renderTypes(); }
function pickVar(v){ variant=v; renderTypes(); }
function step(d){ $('inAmount').value=Math.max(1,(parseInt($('inAmount').value||'0',10)||0)+d); }

async function load(){ try{ const r=await api('/api/workouts'); data=r.workouts||[]; $('banner').classList.add('hidden'); }
  catch(e){ $('banner').classList.remove('hidden'); $('banner').textContent='⚠️ Offline — '+e.message; } paintDay(); }
async function save(){
  const u=TYPES[type].unit, iso=isoOf(selDate());
  const body={ category:type, variant, exercise:type+' · '+variant, amount:parseInt($('inAmount').value,10), unit:u, date:iso };
  if(!body.amount||body.amount<=0) return toast('❌ Valore non valido');
  try{ const r=await api('/api/workouts',{method:'POST',body:JSON.stringify(body)}); data.unshift(r.workout); toast(`✅ +${body.amount} · ${type} ${variant}`); }
  catch(e){ data.unshift({id:Date.now(),...body,created_at:new Date().toISOString()}); toast('📴 Salvato in locale · '+e.message); }
  render();
}
async function del(id){ if(!confirm('Eliminare?'))return;
  try{ await api('/api/workouts?id='+id,{method:'DELETE'}); }catch(e){}
  data=data.filter(w=>w.id!==id); render(); }
function changeGoal(){ const v=prompt('Obiettivo giornaliero (reps/sec totali)?',goal); const n=parseInt(v,10); if(n>0){goal=n;$('goalVal').textContent=n;render();} }

function keyOf(w){ return (w.category&&w.variant)?(w.category+' · '+w.variant):w.exercise; }
function render(){
  const iso=isoOf(selDate());
  const dayRows=data.filter(w=>w.date===iso);
  const dayTot=dayRows.reduce((s,w)=>s+w.amount,0);
  const pct=Math.min(100,Math.round(dayTot/goal*100));
  $('goalBar').style.width=pct+'%'; $('goalPct').textContent=pct+'%';
  $('goalText').textContent = `${dayTot}/${goal} oggi · ${pct>=100?'🎉 Target raggiunto!':(goal-dayTot)+' mancanti'}`;
  // stats per esercizio
  $('perEx').innerHTML=NAMES.map(n=>{
    const rows=data.filter(w=>keyOf(w)===n.label);
    const vol=rows.reduce((s,w)=>s+w.amount,0);
    const pr=rows.length?Math.max(...rows.map(w=>w.amount)):0;
    const avg=rows.length?(vol/rows.length):0;
    const last5=rows.slice(0,5).map(w=>w.amount);
    const trend=last5.length>1?(last5[0]-last5[last5.length-1]):0;
    const u=n.unit==='seconds'?'s':'';
    const spark=last5.slice().reverse().map((v,i,a)=>{ const m=Math.max(...a,1); return `<div class="flex-1 rounded-sm" title="${v}" style="height:${Math.max(15,Math.round(v/m*100))}%;background:${i===a.length-1?'#22d3ee':'rgba(255,255,255,.2)'}"></div>`; }).join('');
    return `<div class="glass px-4 py-3" style="border-radius:20px">
      <div class="flex items-center gap-2"><span class="text-xl">${n.icon}</span><span class="flex-1 text-[13px] font-bold">${esc(n.label)}</span>
      <span class="text-[11px] font-extrabold ${trend>0?'text-emerald-300':trend<0?'text-red-300':'text-slate-500'}">${trend>0?'↗ +'+trend:trend<0?'↘ '+trend:'→ 0'}</span></div>
      <div class="flex justify-between text-[11px] text-slate-400 mt-1"><span>Vol <b class="text-slate-100">${vol}${u}</b></span><span>PR <b class="text-amber-300">${pr}${u}</b></span><span>Media <b class="text-slate-100">${avg.toFixed(1)}${u}</b></span><span>×${rows.length}</span></div>
      <div class="flex items-end gap-1 h-8 mt-2">${spark||'<span class="text-[10px] text-slate-600">nessun dato</span>'}</div></div>`; }).join('');
  const rows=dayRows;
  $('history').innerHTML=rows.length?rows.map(w=>`<div class="glass px-4 py-3 flex items-center gap-2" style="border-radius:18px">
    <div class="flex-1 min-w-0 text-sm"><b>${esc(keyOf(w))}</b> · +${w.amount}${w.unit==='seconds'?'s':''}</div>
    <button onclick="del(${w.id})" class="touch press px-3 text-slate-500">✕</button></div>`).join('')
   :'<p class="text-xs text-slate-500 text-center py-4">Nessun inserimento in questo giorno.</p>';
}
document.addEventListener('DOMContentLoaded',()=>{ renderTypes(); load(); });
</script>
</body>
</html>
