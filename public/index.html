<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>HOME-GYM · Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="app.css" />
</head>
<body data-page="home">
<main class="w-full max-w-sm mx-auto px-3 pt-6 pb-10 space-y-3" style="padding-top:calc(1.5rem + env(safe-area-inset-top))">
  <div class="glass rounded-3xl p-6 text-center">
    <p class="text-5xl">💪</p>
    <h1 class="text-2xl font-extrabold mt-2">Home Gym</h1>
    <p class="text-xs text-slate-400">Calistenica a casa · iOS OLED</p>
  </div>
  <div id="banner" class="hidden text-xs px-4 py-3 glass rounded-2xl text-amber-300"></div>
  <div id="streakStrip" class="glass rounded-3xl px-4 py-3 flex items-center gap-3"></div>
  <a href="stats.html" class="press glass rounded-3xl p-5 flex items-center gap-4 w-full text-left">
    <span class="text-4xl">📊</span>
    <span class="flex-1">
      <span class="font-extrabold text-lg block">Statistiche</span>
      <span id="homeStatsSub" class="text-[11px] text-slate-400">Streak · volumi · PR · medie</span>
    </span>
    <span class="text-slate-500 font-extrabold text-xl">›</span>
  </a>
  <div id="homeGrid" class="grid grid-cols-1 gap-2"></div>
  <div class="grid grid-cols-2 gap-2">
    <a href="profile.html" class="press glass rounded-3xl p-4 text-center">
      <div class="text-3xl">👤</div><div class="font-extrabold text-sm mt-1">Profilo</div>
      <div class="text-[11px] text-slate-400">Username · Stato · target</div>
    </a>
    <a href="rank.html" id="quickRank" class="press rounded-3xl p-4 text-center text-white" style="background:linear-gradient(135deg,#6366f1,#22d3ee)">
      <div class="text-3xl">🏆</div><div class="font-extrabold text-sm mt-1">Classifiche</div>
      <div class="text-[11px] opacity-80">Mondiale · Stato · Stanze</div>
    </a>
  </div>
  <div class="glass rounded-3xl p-4">
    <h2 class="font-bold text-sm">🔒 Stanze private</h2>
    <p class="text-[11px] text-slate-500">Sfide tra amici — tocca per entrare</p>
    <div id="roomsHome" class="mt-2 space-y-2"></div>
  </div>
</main>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-8 z-30 px-5 py-3 rounded-2xl font-bold text-sm opacity-0 pointer-events-none glass whitespace-nowrap">✅</div>
<script src="app.js"></script>
</body>
</html>
